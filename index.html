<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" <div class="card">
  <h3>📸 Анализ еды</h3>
  <p>Сфотографируй или выбери фото блюда</p>

  <input
    type="file"
    id="foodPhoto"
    accept="image/*"
    capture="environment"
    onchange="showFoodPhoto(event)"
  >

  <img
    id="foodPreview"
    style="display:none; width:100%; margin-top:15px; border-radius:15px;"
  >

  <button onclick="analyzeFood()">
    🔍 Определить калории
  </button>

  <p id="photoResult"></p>
</div>

<script>
function showFoodPhoto(event) {
  const file = event.target.files[0];

  if (!file) return;

  const preview = document.getElementById("foodPreview");

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  document.getElementById("photoResult").textContent =
    "Фото загружено ✅";
}

async function analyzeFood() {
  const file = document.getElementById("foodPhoto").files[0];
  const result = document.getElementById("photoResult");

  if (!file) {
    result.textContent = "Сначала выбери фотографию еды 📸";
    return;
  }

  result.textContent = "🔍 Анализирую фото...";

  const reader = new FileReader();

  reader.onload = async function () {
    try {
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: reader.result
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Ошибка анализа");
      }

      result.textContent =
        "🍽️ Результат:\n" + JSON.stringify(data);
    } catch (error) {
      result.textContent = "❌ Ошибка: " + error.message;
    }
  };

  reader.readAsDataURL(file);
}
