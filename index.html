<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" <div class="card">
  <h3>📸 Анализ еды</h3>
  <p>Сфотографируй или выбери фото блюда</p>

  <input
    type="file"
    id="foodPhoto"
    accept="image/*"
    capture="environment"
    onchange="showFoodPhoto(event)"
  >

  <img
    id="foodPreview"
    style="display:none; width:100%; margin-top:15px; border-radius:15px;"
  >

  <button onclick="analyzeFood()">
    🔍 Определить калории
  </button>

  <p id="photoResult"></p>
</div>

<script>
function showFoodPhoto(event) {
  const file = event.target.files[0];

  if (!file) return;

  const preview = document.getElementById("foodPreview");

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  document.getElementById("photoResult").textContent =
    "Фото загружено ✅";
}

function analyzeFood() {
  const file = document.getElementById("foodPhoto").files[0];

  if (!file) {
    document.getElementById("photoResult").textContent =
      "Сначала выбери фотографию еды 📸";
    return;
  }

  document.getElementById("photoResult").textContent =
    "Фото готово к анализу 🤖\nФункцию определения калорий подключим следующим шагом.";
}
</script>
